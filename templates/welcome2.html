<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <title>Welcome — Mind Bloom 🌿</title>
 <link rel="stylesheet" href="/static/css/style.css"/>
 <link rel="icon" href="/static/images/logo.png"/>
 <style>
 body { min-height: 100vh; overflow-x: hidden; }
 .w2-page {
 min-height: 100vh;
 display: flex; flex-direction: column;
 align-items: center; justify-content: center;
 padding: 80px 20px 40px;
 position: relative;
 }
 /* Child theme */
 .theme-child { background: linear-gradient(135deg, #f0f7ee, #e8f5e9, #f4f9f4); }
 /* Teen theme */
 .theme-teen { background: linear-gradient(135deg, #f4f7f4, #eef2ee); }
 .hearts-bg {
 position: fixed; inset: 0; pointer-events: none; z-index: 0;
 }
 .heart-float {
 position: absolute;
 color: var(--sage-300);
 opacity: 0.3;
 animation: heartFloat linear infinite;
 font-size: 1.2rem;
 }
 @keyframes heartFloat {
 0%{transform:translateY(0) rotate(0deg);opacity:0}
 15%{opacity:0.3}
 85%{opacity:0.3}
 100%{transform:translateY(-100vh) rotate(30deg);opacity:0}
 }
 /* Adult theme */
 .theme-adult { background: linear-gradient(135deg, #f4f7f0, #edf4ed); }
 /* Senior theme */
 .theme-senior { background: linear-gradient(135deg, #f9f6f0, #f4f0e8); }

 .welcome-card {
 max-width: 580px; width: 100%;
 background: rgba(255,255,255,0.9);
 backdrop-filter: blur(16px);
 border-radius: 32px;
 padding: 52px 44px;
 box-shadow: 0 16px 60px rgba(90,138,90,0.14);
 border: 1px solid rgba(168,200,168,0.3);
 text-align: center;
 position: relative; z-index: 1;
 }
 .age-icon {
 font-size: 4rem;
 animation: float 3s ease-in-out infinite;
 display: block; margin-bottom: 16px;
 }
 .welcome-name {
 font-family: 'Josefin Sans', sans-serif;
 font-size: 2.8rem; color: var(--sage-700);
 margin-bottom: 6px;
 }
 .welcome-msg {
 font-family: 'Quicksand', sans-serif;
 font-style: italic;
 font-size: 1.15rem;
 color: var(--text-dark);
 line-height: 1.7;
 margin-bottom: 20px;
 }
 .welcome-sub {
 font-size: 0.92rem;
 color: var(--text-light);
 line-height: 1.7;
 max-width: 440px; margin: 0 auto;
 }
 .graphics-row {
 display: none;
 }
 .graphic-icon { display: none; }
 .btn-row {
 display: flex; justify-content: space-between; align-items: center;
 margin-top: 36px; gap: 12px; flex-wrap: wrap;
 }
 .music-note {
 position: absolute;
 font-size: 1.5rem;
 opacity: 0.15;
 animation: musicFloat linear infinite;
 pointer-events: none;
 }
 @keyframes musicFloat {
 0%{transform:translateY(0) scale(0.8);opacity:0}
 20%{opacity:0.15}
 80%{opacity:0.15}
 100%{transform:translateY(-80px) scale(1.1);opacity:0}
 }
 </style>
</head>
<body class="has-shell">
 <!-- Loader -->
 <div id="page-loader">
 <img src="/static/images/load.png" class="loader-img" alt="Loading"/>
 <div class="loader-brand">Mind Bloom</div>
 <div class="loader-dots"><span></span><span></span><span></span></div>
 </div>

 <!-- Topbar -->
 <div class="app-shell">
<nav class="topbar">
 <div class="topbar-brand">
 <img src="/static/images/logo.png" alt="Logo"/>
 <span>Mind Bloom</span>
 </div>
 <div style="font-size:0.8rem;color:var(--text-light);">Step 2 of 7</div>
 </nav>

 <!-- Themed backgrounds (injected by JS) -->
 <div id="bg-fx"></div>

 <div class="w2-page" id="w2-page">
 <div class="welcome-card" id="welcome-card">
 <span class="age-icon" id="age-icon"></span>
 <div class="welcome-name anim-fadeInUp" id="welcome-name">Hello!</div>
 <div class="welcome-msg anim-fadeInUp delay-1" id="welcome-msg">We're so glad you're here.</div>
 <p class="welcome-sub anim-fadeInUp delay-3" id="welcome-sub"></p>

 <div class="btn-row anim-fadeInUp delay-4">
 <button class="btn btn-outline" onclick="navigateTo('/help')">
 💡 <span data-t="help">Help</span>
 </button>
 <button class="btn btn-primary btn-lg" onclick="navigateTo('/lifestyle')">
 <span data-t="proceed">Proceed →</span>
 </button>
 </div>
 </div>
 </div>

 {% include 'partials/bottom_nav.html' %}
</div>

<script src="/static/js/main.js"></script>
 <script>
 window.addEventListener('DOMContentLoaded', () => {
 const user = MB.get('user');
 if (!user) { navigateTo('/login'); return; }

 const { name, age } = user;
 const page = document.getElementById('w2-page');
 const card = document.getElementById('welcome-card');
 const nameEl = document.getElementById('welcome-name');
 const msgEl = document.getElementById('welcome-msg');
 const subEl = document.getElementById('welcome-sub');
 const iconEl = document.getElementById('age-icon');
 const bgFx = document.getElementById('bg-fx');

 nameEl.textContent = `Welcome, ${name}! 🌿`;

 if (age <= 12) {
 // CHILD
 page.className = 'w2-page theme-child';
 iconEl.textContent = '🧸';
 msgEl.textContent = 'Hello little friend! We are so glad you\'re here!';
 subEl.textContent = 'This small questionnaire will help you talk about how you feel inside. There are no right or wrong answers — just be yourself!';
 bgFx.innerHTML = Array.from({length:12}, () => {
 const icons = ['🌸','🌿','🍃','🌱','🍀'];
 const icon = icons[Math.floor(Math.random()*icons.length)];
 return `<span style="position:fixed;font-size:${1+Math.random()*0.8}rem;
 left:${Math.random()*100}%;top:${Math.random()*100}%;
 opacity:0.1;animation:float ${4+Math.random()*3}s ease-in-out ${Math.random()*2}s infinite;">${icon}</span>`;
 }).join('');

 } else if (age >= 13 && age <= 19) {
 // TEEN
 page.className = 'w2-page theme-teen';
 iconEl.textContent = '🌙';
 msgEl.textContent = `Hey ${name}! Life hits different sometimes, doesn't it?`;
 subEl.textContent = 'Being a teen is hard. But talking about how you feel is the most courageous thing you can do. No judgement here — only good energy and understanding.';
 // Floating hearts
 bgFx.className = 'hearts-bg';
 bgFx.innerHTML = Array.from({length:20}, () =>
 `<span class="heart-float" style="left:${Math.random()*100}%;
 animation-duration:${6+Math.random()*6}s;
 animation-delay:${Math.random()*5}s;">♡</span>`
 ).join('') + Array.from({length:8}, () =>
 `<span class="music-note" style="left:${Math.random()*100}%;
 bottom:${Math.random()*30}%;
 animation-duration:${3+Math.random()*3}s;
 animation-delay:${Math.random()*3}s;">♪</span>`
 ).join('');

 } else if (age <= 60) {
 // ADULT
 page.className = 'w2-page theme-adult';
 iconEl.textContent = '🌿';
 msgEl.textContent = `Hey ${name}, you are doing incredible!`;
 subEl.textContent = 'You are handling responsibilities, work, and relationships — all at once. That takes real strength. Do not stress up more — live your heart out! Take this moment just for YOU.';
 bgFx.innerHTML = Array.from({length:8}, (_, i) => {
 const icons = ['🌿','💚','🍃'];
 return `<span style="position:fixed;font-size:${2+Math.random()}rem;
 left:${Math.random()*100}%;top:${Math.random()*100}%;
 opacity:0.07;animation:float ${5+Math.random()*4}s ease-in-out ${i*0.5}s infinite;">${icons[i%3]}</span>`;
 }).join('');

 } else {
 // SENIOR
 page.className = 'w2-page theme-senior';
 iconEl.textContent = '🕊';
 msgEl.textContent = `My dear ${name}, you look absolutely wonderful!`;
 subEl.textContent = 'You did so well in your past — what is bothering you, my dear friend? You look young and radiant. Your wisdom is an inspiration. Take a moment, breathe easy, and let us understand your feelings together.';
 bgFx.innerHTML = Array.from({length:6}, () =>
 `<span style="position:fixed;font-size:${1.5+Math.random()}rem;
 left:${Math.random()*100}%;top:${Math.random()*100}%;
 opacity:0.08;animation:float ${6+Math.random()*4}s ease-in-out ${Math.random()*3}s infinite;">🕊</span>`
 ).join('');
 }
 });
 </script>
</body>
</html>
